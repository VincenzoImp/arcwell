name: Pinned versions

# Exact pins compose the same environment twice; they also age without saying so. This is the
# thing that says so. It never changes a pin — a bump is a decision with its own verification.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updates:
    name: Compare pins against the registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare every pinned version against what is published
        run: npm run check:updates
