name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Node 24.15.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check redistributed upstream extensions for drift
        run: npm run check:upstream

      - name: Smoke-test prepare build from a clean local copy
        run: npm run test:prepare

      - name: Smoke-test pushed main through the Pi Git source transport
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:git-source -- main

      - name: Smoke-test real Pi packages
        run: npm run test:packages

      - name: Inspect package payload
        run: npm pack --dry-run --json
