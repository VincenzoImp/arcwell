name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Node 24.15.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check redistributed upstream extensions for drift
        run: npm run check:upstream

      - name: Smoke-test prepare build from a clean local copy
        run: npm run test:prepare

      - name: Smoke-test the pushed ref through the Pi Git source transport
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        run: npm run test:git-source -- ${{ github.ref_name }}

      # Only on tags: setup installs ARCWELL_PACKAGE_SOURCE, which points at a released tag.
      # Not on Windows: the commands cannot invoke `pi` there at all, because the client spawns
      # it from PATH with shell: false and npm installs it as a .cmd shim. Running this step
      # would report a defect already recorded in the README, every time, as a build failure.
      - name: Smoke-test the full lifecycle against the pushed tag
        if: github.event_name == 'push' && github.ref_type == 'tag' && runner.os != 'Windows'
        run: npm run test:lifecycle -- ${{ github.ref_name }}

      - name: Smoke-test real Pi packages
        run: npm run test:packages

      - name: Inspect package payload
        run: npm pack --dry-run --json
